services:
  cache:
    image: redis:6.2.24-alpine
    # The app starts once Redis answers, rather than crawling the sites uncached at first
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
  w2w:
    build:
      context: .
      args:
        - W2W_VERSION=0.0.1
    # Spring Boot binds these to the settings, e.g. W2W_SUGGESTIONS_RATINGTHRESHOLD to w2w.suggestions.rating-threshold
    environment:
      - REDIS_HOST=cache
      - W2W_SUGGESTIONS_RATINGTHRESHOLD=5.8
      - W2W_TITLES_STREAMINGSERVICES=nfx,prv,dnp
      - HTTP_REQUESTSPERSECONDBYDOMAIN_FILMWEB_PL=4
      - LOGGING_LEVEL_PL_CIRUK=INFO
      # About 100 MB stays live, most of it the IMDb index, so the JVM's own collector choice and code cache do
      - JDK_JAVA_OPTIONS=-Xmx512m
        -XX:+PreserveFramePointer
        -Xlog:gc*:file=/what-to-watch/logs/gc.log:time,uptime,level,tags:filecount=5,filesize=10m
    # Runs as me rather than root, so the ratings file it replaces stays mine on a Linux host. Set W2W_UID and
    # W2W_GID to my ids if they aren't 1000 (`id -u`, `id -g`).
    user: "${W2W_UID:-1000}:${W2W_GID:-1000}"
    # The app rates straight into the repository's ratings, so git shows what I rated. The whole directory is
    # mounted, because a file is replaced by renaming a new one over it.
    volumes:
      - ./what-to-watch-ratings/src/main/resources:/what-to-watch/ratings
      # GC logs, kept apart from the app's log and across new containers
      - w2w-logs:/what-to-watch/logs
    ports:
      - "8080:8080"
      # Health and metrics, for this machine only
      - "127.0.0.1:8081:8081"
    depends_on:
      cache:
        condition: service_healthy

volumes:
  redis-data:
  w2w-logs:
