services:
  cache:
    image: redis:6.2.24-alpine
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
  w2w:
    build:
      context: .
      args:
        - W2W_VERSION=0.0.1
    # Spring Boot binds these to the settings, e.g. W2W_POOL_SIZE to w2w.pool.size
    environment:
      - REDIS_HOST=cache
      - W2W_POOL_SIZE=32
      - W2W_POOL_USEVIRTUAL=true
      - W2W_SUGGESTIONS_RATINGTHRESHOLD=5.4
      - W2W_TITLES_STREAMINGSERVICES=nfx,prv,dnp
      - HTTP_REQUESTSPERSECONDBYDOMAIN_FILMWEB_PL=4
      - LOGGING_LEVEL_PL_CIRUK=INFO
      - JDK_JAVA_OPTIONS=-Xms2G
        -Xmx2G
        -XX:+UseZGC
        -XX:+UseNUMA
        -XX:+UseStringDeduplication
        -XX:InitialCodeCacheSize=256m
        -XX:ReservedCodeCacheSize=256m
        -XX:+PreserveFramePointer
        -Xlog:gc*:file=/what-to-watch/logs/gc.log:time,uptime,level,tags:filecount=5,filesize=10m
    # Runs as me rather than root, so the ratings file it replaces stays mine on a Linux host. Set W2W_UID and
    # W2W_GID to my ids if they aren't 1000 (`id -u`, `id -g`).
    user: "${W2W_UID:-1000}:${W2W_GID:-1000}"
    # The app rates straight into the repository's ratings, so git shows what I rated. The whole directory is
    # mounted, because a file is replaced by renaming a new one over it.
    volumes:
      - ./what-to-watch-neural/src/main/resources:/what-to-watch/ratings
      # GC logs, kept apart from the app's log and across new containers
      - w2w-logs:/what-to-watch/logs
    ports:
      - "8080:8080"
    depends_on:
      - cache

volumes:
  redis-data:
  w2w-logs:
