services:
  cache:
    image: redis:6.2.24-alpine
    hostname: redis
    ports:
      - "127.0.0.1:6379:6379"
  w2w:
      build:
        context: .
        args:
          - W2W_VERSION=0.0.1
      hostname: w2w-app
      environment:
        - W2W_TITLES_PAGES_PER_REQUEST=10
        - W2W_THREAD_POOL_SIZE=32
        - W2W_THREAD_POOL_USE_VIRTUAL=true
        - REDIS_HOST=cache
        - W2W_LOGGING_LEVEL=INFO
        - W2W_HTTP_REQUESTS_PER_SECOND=2
        - JVM_OPTS=-Xmx2G
          -Xms2G
          -XX:+TieredCompilation
          -XX:InitialCodeCacheSize=256m
          -XX:ReservedCodeCacheSize=256m
          -XX:+PreserveFramePointer
          -XX:+UnlockExperimentalVMOptions
          -XX:+UseZGC
          -XX:+UseNUMA
          -XX:+UseStringDeduplication
          -Xlog:gc:stdout:time
      ports:
        - "8080:8080"
      depends_on:
        - cache
