name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # The live-site tests catch changes on Filmweb, IMDb and Metacritic, so run them on weekdays
  schedule:
    - cron: '0 15 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build

  live-sites:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew downloadImdbDatasets integrationTest
