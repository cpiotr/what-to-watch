ext.moduleName = 'what.to.watch.boot'

apply plugin: 'java'
apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'

java {
    sourceCompatibility = JavaVersion.toVersion(project.javaVersion)
    targetCompatibility = JavaVersion.toVersion(project.javaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.release = project.javaVersion.toInteger()
}

testing {
    suites {
        test {
            useJUnitJupiter()
        }
        benchmark(JvmTestSuite) {
            useJUnitJupiter()
            dependencies {
                implementation project()
            }
        }
    }
}

configurations {
    benchmarkImplementation.extendsFrom testImplementation
}

// The dependency-management plugin applies Boot's BOM to every configuration, which downgrades
// SpotBugs' own libraries and breaks it. Keep the versions SpotBugs asks for.
configurations.matching { it.name.startsWith('spotbugs') }.configureEach {
    incoming.beforeResolve {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.version) {
                details.useVersion(details.requested.version)
            }
        }
    }
}

dependencies {
    implementation project(":what-to-watch-core")

    implementation("org.springframework.boot:spring-boot-starter-jersey:$springBootVersion")
    implementation("org.glassfish.jersey.media:jersey-media-sse")
    implementation("org.springframework.boot:spring-boot-starter-web:$springBootVersion")
    implementation("org.springframework.boot:spring-boot-starter-actuator:$springBootVersion")
    implementation("io.micrometer:micrometer-registry-jmx")
    implementation("io.micrometer:micrometer-core")
    implementation("redis.clients:jedis")
    implementation("org.jsoup:jsoup:$jsoupVersion")
    implementation("com.squareup.okhttp3:okhttp:$okHttpVersion")
    implementation("net.jodah:failsafe:$failsafeVersion")
    implementation("com.github.ben-manes.caffeine:caffeine")
    implementation("com.github.spotbugs:spotbugs-annotations:$spotbugsVersion")
    implementation("org.lz4:lz4-java:$lz4Version")

    testImplementation("org.springframework.boot:spring-boot-starter-test:$springBootVersion")
    testImplementation("org.junit.jupiter:junit-jupiter-api")
    testImplementation("org.junit.jupiter:junit-jupiter-engine")
    testImplementation("org.testcontainers:testcontainers")
    testImplementation("org.testcontainers:junit-jupiter")

    benchmarkImplementation("org.openjdk.jmh:jmh-core:$jmhVersion")
    benchmarkImplementation("org.openjdk.jmh:jmh-generator-annprocess:$jmhVersion")
}

println("[what-to-watch-boot] Building version: $version")
