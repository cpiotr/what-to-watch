apply plugin: 'java'
apply plugin: 'org.springframework.boot'

java {
    sourceCompatibility = JavaVersion.toVersion(project.javaVersion)
    targetCompatibility = JavaVersion.toVersion(project.javaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.release = project.javaVersion.toInteger()
}

testing {
    suites {
        test {
            useJUnitJupiter()
        }
        benchmark(JvmTestSuite) {
            useJUnitJupiter()
            dependencies {
                implementation project()
            }
        }
    }
}

configurations {
    benchmarkImplementation.extendsFrom testImplementation
}

// The benchmarks start Redis in Docker
tasks.register('jmh', JavaExec) {
    group = 'verification'
    description = 'Runs the JMH benchmarks.'
    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
}

// Asks the live sites, so only when they have changed their pages
tasks.register('recordBenchmarkPages', JavaExec) {
    description = 'Records the pages the benchmarks score.'
    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass = 'pl.ciruk.whattowatch.benchmark.RecordPages'
    args file('src/benchmark/resources/recorded-pages.json.gz')
}

bootRun {
    dependsOn ':downloadImdbDatasets'
    systemProperty 'w2w.imdb.datasets-directory', rootProject.file('imdb')
    // Run locally, the app rates straight into the repository's ratings, so git shows what I rated
    systemProperty 'w2w.ratings.file', project(':what-to-watch-ratings').file('src/main/resources/rated-films.csv')
}

dependencies {
    implementation(platform("org.springframework.boot:spring-boot-dependencies:$springBootVersion"))
    // The ratings module uses a newer Kotlin than Boot's BOM, so all of Kotlin's libraries follow it
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:$kotlinVersion"))
    implementation project(":what-to-watch-core")
    implementation project(":what-to-watch-ratings")

    implementation("org.springframework.boot:spring-boot-starter-webmvc")
    implementation("org.springframework.boot:spring-boot-starter-actuator")
    implementation("io.micrometer:micrometer-registry-jmx")
    implementation("io.micrometer:micrometer-registry-prometheus")
    implementation("io.micrometer:micrometer-core")
    implementation("redis.clients:jedis")
    implementation("org.jsoup:jsoup:$jsoupVersion")
    implementation("com.squareup.okhttp3:okhttp:$okHttpVersion")
    implementation("net.jodah:failsafe:$failsafeVersion")
    implementation("com.github.ben-manes.caffeine:caffeine")
    implementation("com.github.spotbugs:spotbugs-annotations:$spotbugsVersion")
    // The maintained fork of org.lz4, which stopped at 1.8.1 with known CVEs
    implementation("at.yawk.lz4:lz4-java:$lz4Version")

    testImplementation("org.springframework.boot:spring-boot-starter-test")
    testImplementation("org.junit.jupiter:junit-jupiter-api")
    testImplementation("org.junit.jupiter:junit-jupiter-engine")
    testImplementation("org.testcontainers:testcontainers")
    testImplementation("org.testcontainers:testcontainers-junit-jupiter")

    benchmarkImplementation("org.openjdk.jmh:jmh-core:$jmhVersion")
    benchmarkAnnotationProcessor("org.openjdk.jmh:jmh-generator-annprocess:$jmhVersion")
}

println("[what-to-watch-boot] Building version: $version")
