# The same settings as the defaults in the code and in docker-compose.yml, to show how each way of running sets them.
# Only Redis's host differs: Docker Compose names its container.
redis.host=localhost
redis.max-connections=32

w2w.titles.pages-per-request=10
w2w.titles.streaming-services=nfx,prv,dnp
w2w.suggestions.rating-threshold=5.4
w2w.cache.long-expiry=10d
w2w.cache.short-expiry=1h

http.requests-per-second-by-domain[filmweb.pl]=4

logging.level.root=INFO
logging.level.pl.ciruk=INFO

# Browsers check for a newer page and script on every load, so a new deploy shows up without a hard refresh
spring.web.resources.cache.cachecontrol.no-cache=true
