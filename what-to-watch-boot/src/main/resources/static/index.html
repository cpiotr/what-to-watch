<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Films and series on your streaming services, ranked by IMDb, Filmweb and Metacritic.">
    <title>What To Watch?</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%238c3b2e'/%3E%3Cpath d='M12 9v14l11-7z' fill='%23fff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/app.js"></script>
</head>
<body>
<header class="masthead">
    <div class="masthead-top">
        <h1 class="brand">
            <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7"/><path d="M12 9v14l11-7z"/></svg>
            What To Watch?
        </h1>
        <fieldset class="toggle kind">
            <legend class="visually-hidden">Show</legend>
            <label><input type="radio" name="kind" value="FILM" checked><span>Films</span></label>
            <label><input type="radio" name="kind" value="SERIES"><span>Series</span></label>
        </fieldset>
        <fieldset class="toggle sort">
            <legend class="visually-hidden">Sort by</legend>
            <label><input type="radio" name="sort" value="score" checked><span>Score</span></label>
            <label><input type="radio" name="sort" value="mine"><span>For you</span></label>
        </fieldset>
    </div>
    <div class="masthead-bottom">
        <p class="tagline">Films and series on your streaming services, ranked by IMDb, Filmweb and Metacritic.</p>
        <div class="masthead-info">
            <dl class="legend" aria-label="How to read a card">
                <div><dt><span class="legend-badge">80%</span></dt><dd>combined score</dd></div>
                <div><dt><svg class="icon heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.5 1.1 5.3 3 1.8-1.9 3.2-3 5.3-3 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z" fill="currentColor"/></svg><span class="visually-hidden">Heart</span></dt><dd>predicted for you</dd></div>
            </dl>
            <p class="status" id="status"></p>
        </div>
    </div>
</header>

<main>
    <ol class="grid" id="films" tabindex="-1" aria-label="Suggested films, best first"></ol>
    <div class="more" id="more" role="status"></div>
</main>

<dialog class="details" id="details" aria-labelledby="details-title"></dialog>
</body>
</html>
