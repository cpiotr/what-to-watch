ext.moduleName = 'what.to.watch.core'

apply plugin: 'java'

java {
    sourceCompatibility = JavaVersion.toVersion(project.javaVersion)
    targetCompatibility = JavaVersion.toVersion(project.javaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.release = project.javaVersion.toInteger()
}

compileJava {
    inputs.property("moduleName", moduleName)
    doFirst {
        options.compilerArgs += ['--module-path', classpath.asPath]
        classpath = files()
    }
}

testing {
    suites {
        test {
            useJUnitJupiter()
        }
        integrationTest(JvmTestSuite) {
            useJUnitJupiter()
            dependencies {
                implementation project()
            }
            targets.all {
                testTask.configure {
                    mustRunAfter test
                    mustRunAfter ':downloadImdbDatasets'
                    systemProperty 'imdb.datasets-directory', rootProject.file('imdb')
                    inputs.files(rootProject.fileTree('imdb')).withPropertyName('imdbDatasets')
                }
            }
        }
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
}


dependencies {
    implementation(platform("org.springframework.boot:spring-boot-dependencies:$springBootVersion"))
    implementation("org.jsoup:jsoup:$jsoupVersion")
    implementation("com.squareup.okhttp3:okhttp:$okHttpVersion")
    implementation("org.slf4j:slf4j-api")
    implementation("com.fasterxml.jackson.core:jackson-core")
    implementation("com.fasterxml.jackson.core:jackson-databind")
    implementation("io.micrometer:micrometer-core")
    implementation("com.github.ben-manes.caffeine:caffeine")

    testImplementation("ch.qos.logback:logback-classic")
    testImplementation("org.junit.jupiter:junit-jupiter-api")
    testImplementation("org.junit.jupiter:junit-jupiter-engine")
    testImplementation("org.mockito:mockito-core")
    testImplementation("org.assertj:assertj-core")
    testImplementation("com.squareup.okhttp3:mockwebserver:$okHttpVersion")

    integrationTestImplementation sourceSets.test.output
}

println("[what-to-watch-core] Building version: $version")
