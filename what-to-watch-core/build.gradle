ext.moduleName = 'what.to.watch.core'

apply plugin: 'java'

java {
    sourceCompatibility = JavaVersion.toVersion(project.javaVersion)
    targetCompatibility = JavaVersion.toVersion(project.javaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.release = project.javaVersion.toInteger()
}

compileJava {
    inputs.property("moduleName", moduleName)
    doFirst {
        options.compilerArgs += ['--module-path', classpath.asPath]
        classpath = files()
    }
}

testing {
    suites {
        test {
            useJUnitJupiter(junitVersion)
        }
        integrationTest(JvmTestSuite) {
            useJUnitJupiter(junitVersion)
            dependencies {
                implementation project()
            }
            targets.all {
                testTask.configure {
                    mustRunAfter test
                }
            }
        }
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
}

check.dependsOn testing.suites.integrationTest

dependencies {
    implementation("org.jsoup:jsoup:$jsoupVersion")
    implementation("com.squareup.okhttp3:okhttp:$okHttpVersion")
    implementation("org.slf4j:slf4j-api:$slf4jVersion")
    implementation("com.fasterxml.jackson.core:jackson-core:$jacksonVersion")
    implementation("com.fasterxml.jackson.core:jackson-databind:$jacksonVersion")
    implementation("io.micrometer:micrometer-core:$micrometerVersion")
    implementation("com.github.ben-manes.caffeine:caffeine:$caffeineVersion")

    testImplementation("ch.qos.logback:logback-classic:$logbackVersion")
    testImplementation("org.junit.jupiter:junit-jupiter-api:$junitVersion")
    testImplementation("org.junit.jupiter:junit-jupiter-engine:$junitVersion")
    testImplementation("org.mockito:mockito-core:$mockitoVersion")
    testImplementation("org.assertj:assertj-core:$assertjVersion")

    integrationTestImplementation sourceSets.test.output
}

println("[what-to-watch-core] Building version: $version")
