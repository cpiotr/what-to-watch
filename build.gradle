buildscript {
    repositories {
        mavenCentral()
        maven {
            url = "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}")
        classpath("com.github.spotbugs.snom:spotbugs-gradle-plugin:6.5.13")
    }
}

allprojects {
    version = "${version != 'unspecified' ? version : 'SNAPSHOT'}"

    apply plugin: 'pmd'
    apply plugin: 'com.github.spotbugs'

    repositories {
        mavenCentral()
    }

    pmd {
        rulesMinimumPriority = 3
        toolVersion = "7.24.0"

        ruleSets = []
        ruleSetFiles = files("$rootProject.projectDir/config/pmd-rules.xml")
    }

    spotbugs {
        toolVersion = spotbugsVersion
        excludeFilter = file("$rootProject.projectDir/config/spotbugs-exclude.xml")
    }
}

// IMDb's non-commercial datasets for local runs and the live IMDb test. The Docker image downloads its own.
// Each file is downloaded again only when IMDb has a newer one, which it publishes daily.
tasks.register('downloadImdbDatasets') {
    def directory = layout.projectDirectory.dir('imdb').asFile
    outputs.dir(directory)
    outputs.upToDateWhen { false }
    doLast {
        directory.mkdirs()
        ['title.ratings.tsv.gz', 'title.basics.tsv.gz'].each { name ->
            ant.get(src: "https://datasets.imdbws.com/$name", dest: new File(directory, name), usetimestamp: true)
        }
    }
}

wrapper {
    gradleVersion = '9.7.1'
}

println("[what-to-watch] Building version: $version")
