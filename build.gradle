buildscript {
    repositories {
        mavenCentral()
        maven {
            url = "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}")
        classpath("com.github.spotbugs.snom:spotbugs-gradle-plugin:6.5.13")
    }
}

apply plugin: 'org.springframework.boot'

allprojects {
    version = "${version != 'unspecified' ? version : 'SNAPSHOT'}"

    apply plugin: 'pmd'
    apply plugin: 'com.github.spotbugs'

    repositories {
        mavenCentral()
    }

    pmd {
        rulesMinimumPriority = 3
        toolVersion = "7.24.0"

        ruleSets = []
        ruleSetFiles = files("$rootProject.projectDir/config/pmd-rules.xml")
    }

    spotbugs {
        toolVersion = spotbugsVersion
        excludeFilter = file("$rootProject.projectDir/config/spotbugs-exclude.xml")
    }
}

wrapper {
    gradleVersion = '9.7.1'
}

println("[what-to-watch] Building version: $version")
