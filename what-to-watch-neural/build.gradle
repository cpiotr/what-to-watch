buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    }
}

apply plugin: 'java'
apply plugin: 'kotlin'

java {
    sourceCompatibility = JavaVersion.toVersion(project.javaVersion)
    targetCompatibility = JavaVersion.toVersion(project.javaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.release = project.javaVersion.toInteger()
}

testing {
    suites {
        test {
            useJUnitJupiter(junitVersion)
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(project.javaVersion)
    }
}

dependencies {
    implementation("org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion")
    implementation("org.beykery:neuroph:$neurophVersion")
    implementation project(":what-to-watch-core")

    implementation("com.github.spotbugs:spotbugs-annotations:$spotbugsVersion")

    testImplementation("org.junit.jupiter:junit-jupiter-api:$junitVersion")
    testImplementation("org.mockito:mockito-core:$mockitoVersion")
    testImplementation("org.assertj:assertj-core:$assertjVersion")
}
